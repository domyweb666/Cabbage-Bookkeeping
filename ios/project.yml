# Xcode 專案由 XcodeGen 產生（開發機是 Windows，專案檔不進版控）。
#   brew install xcodegen && cd ios && xcodegen generate
name: AIFinance

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FinanceCore:
    path: Packages/FinanceCore
  # 蔬菜家族設定頁的共用元件（公開 repo）。版本鎖在 tag，升版要自己改這裡。
  VeggieKit:
    url: https://github.com/domyweb666/VeggieKit
    exactVersion: 1.0.2
  # 明細、分析頁的橫幅廣告（2026-11-27）。只給 App 用，小工具不連。
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0

targets:
  AIFinance:
    type: application
    platform: iOS
    sources:
      - path: AIFinance
      # App 和小工具都要編的：快照怎麼放、控制中心的動作。
      - path: Shared
    dependencies:
      - package: FinanceCore
      - package: VeggieKit
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: BaicaiWidget
    info:
      path: AIFinance/Resources/Info.plist
      properties:
        CFBundleDisplayName: 白菜記帳
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 按「掃發票」或收據的「拍照」才問。相簿走系統的選照片畫面，不用權限。
        NSCameraUsageDescription: 掃發票和拍收據要用相機。
        # 小工具按下去打開記一筆（baicai://entry）。網址不帶資料，打開畫面而已。
        CFBundleURLTypes:
          - CFBundleURLName: org.domyweb.baicai
            CFBundleURLSchemes: [baicai]
        # AdMob。現在是 Google 公開的測試 App ID，送審前換成多米 AdMob 後台那組（docs/上架指南.md 廣告一節）。
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # 正式橫幅編號。空的就不出廣告（Debug 版一律用測試編號）。
        BaicaiBannerUnitID: ""
        # 只放非個人化廣告，不跳追蹤詢問，所以沒有 NSUserTrackingUsageDescription。
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    entitlements:
      path: AIFinance/Resources/AIFinance.entitlements
      properties:
        # 跟小工具共用的資料夾。後台要先建這個 App Group，兩個 App ID 都要勾（docs/上架指南.md 步驟 4）。
        com.apple.security.application-groups:
          - group.org.domyweb.baicai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai
        PRODUCT_NAME: AIFinance
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # App 和小工具的 Release 走手動簽章，Team 由 testflight.yml 帶入。
        # [sdk=iphoneos*] 讓模擬器版不受影響。描述檔名要跟 ios/ci 裡的一字不差。
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Baicai CI App Store

  # 小工具和控制中心按鈕。跟 App 分開簽章，編號要是 App 的編號再加一段。
  BaicaiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BaicaiWidget
      - path: Shared
      # 顏色和字級跟 App 用同一份，不另外抄。
      - path: AIFinance/DesignSystem/DomyTokens.swift
      - path: AIFinance/DesignSystem/Theme.swift
    dependencies:
      - package: FinanceCore
    info:
      path: BaicaiWidget/Info.plist
      properties:
        CFBundleDisplayName: 白菜記帳
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BaicaiWidget/BaicaiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.baicai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai.widget
        PRODUCT_NAME: BaicaiWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Baicai Widget CI App Store

  AIFinanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AIFinanceUITests
    dependencies:
      - target: AIFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AIFinance

schemes:
  AIFinance:
    build:
      targets:
        AIFinance: all
        BaicaiWidget: all
        AIFinanceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIFinanceUITests
    archive:
      config: Release
