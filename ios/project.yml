# Xcode 專案由 XcodeGen 產生（開發機是 Windows，專案檔不進版控）。
#   brew install xcodegen && cd ios && xcodegen generate
name: AIFinance

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 建置時由 CI 或本機的 xcodebuild 參數帶入；留空就是示範模式。
    SUPABASE_HOST: ""
    SUPABASE_ANON_KEY: ""

packages:
  FinanceCore:
    path: Packages/FinanceCore

targets:
  AIFinance:
    type: application
    platform: iOS
    sources:
      - path: AIFinance
    dependencies:
      - package: FinanceCore
    info:
      path: AIFinance/Resources/Info.plist
      properties:
        CFBundleDisplayName: 白菜記帳
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 用語音記帳時，需要透過麥克風聽你說的那一句話。
        NSSpeechRecognitionUsageDescription: 把你說的話轉成文字，再整理成一筆紀錄。
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    entitlements:
      path: AIFinance/Resources/AIFinance.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai
        PRODUCT_NAME: AIFinance
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  AIFinanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AIFinanceUITests
    dependencies:
      - target: AIFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AIFinance

schemes:
  AIFinance:
    build:
      targets:
        AIFinance: all
        AIFinanceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIFinanceUITests
    archive:
      config: Release
