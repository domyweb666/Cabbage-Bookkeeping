# Xcode 專案由 XcodeGen 產生（開發機是 Windows，專案檔不進版控）。
#   brew install xcodegen && cd ios && xcodegen generate
name: AIFinance

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FinanceCore:
    path: Packages/FinanceCore
  # 蔬菜家族設定頁的共用元件（公開 repo）。版本鎖在 tag，升版要自己改這裡。
  VeggieKit:
    url: https://github.com/domyweb666/VeggieKit
    exactVersion: 1.0.1

targets:
  AIFinance:
    type: application
    platform: iOS
    sources:
      - path: AIFinance
    dependencies:
      - package: FinanceCore
      - package: VeggieKit
    info:
      path: AIFinance/Resources/Info.plist
      properties:
        CFBundleDisplayName: 白菜記帳
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai
        PRODUCT_NAME: AIFinance
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # 只有這個 target 的 Release 走手動簽章，Team 由 testflight.yml 帶入。
        # [sdk=iphoneos*] 讓模擬器版不受影響。描述檔名要跟 ios/ci 裡的一字不差。
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Baicai CI App Store

  AIFinanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AIFinanceUITests
    dependencies:
      - target: AIFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.baicai.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AIFinance

schemes:
  AIFinance:
    build:
      targets:
        AIFinance: all
        AIFinanceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIFinanceUITests
    archive:
      config: Release
