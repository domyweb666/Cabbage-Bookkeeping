name: CI

on:
  # 分支的推送由 pull_request 觸發，避免同一個 commit 跑兩次。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 後端測試（Deno + 本機 Supabase）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 型別檢查
        run: deno check supabase/functions/record/index.ts supabase/functions/ask/index.ts supabase/tests/*.ts eval/*.ts

      - name: 啟動本機 Supabase
        run: |
          printf 'AI_PROVIDER=mock\n' > supabase/functions/.env
          supabase start
          supabase status -o env | sed 's/^\([A-Z_]*\)="\(.*\)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: 規則、資料庫、記帳、查帳測試
        run: deno test --allow-net --allow-env --allow-read supabase/tests

      - name: Edge Function 冒煙測試（HTTP）
        run: deno run --allow-net --allow-env supabase/tests/smoke.ts

      - name: 失敗時印出 Edge Function 紀錄
        if: failure()
        run: docker logs supabase_edge_runtime_cabbage 2>&1 | tail -80 || true

  ios:
    name: iOS（FinanceCore 測試、建置、畫面測試）
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version && swift --version

      - name: FinanceCore 單元測試
        run: swift test --package-path ios/Packages/FinanceCore

      - name: 產生 Xcode 專案
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: 選一台模擬器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          runtimes = sorted((r for r in data if 'iOS' in r), reverse=True)
          for r in runtimes:
              phones = [d for d in data[r] if d['name'].startswith('iPhone') and 'SE' not in d['name']]
              if phones:
                  pick = next((d for d in phones if 'Pro' not in d['name'] and 'Plus' not in d['name']), phones[0])
                  print(pick['udid']); break
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: 建置並跑畫面測試（示範後端）
        run: |
          set -o pipefail
          cd ios
          xcodebuild test             -project AIFinance.xcodeproj -scheme AIFinance             -destination "id=${{ steps.sim.outputs.udid }}"             -resultBundlePath build/ui.xcresult             -derivedDataPath build/DerivedData             2>&1 | tee build.log | grep -E "error:|warning: unre|Test Case|Test Suite|\*\* |Testing failed|failed|passed" | grep -v "^$" | tail -150

      - name: 匯出截圖
        if: always()
        run: |
          cd ios
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/screenshots || true
          ls build/screenshots | head -50

      - name: 上傳截圖與紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: |
            ios/build/screenshots
            ios/build.log
          retention-days: 14
