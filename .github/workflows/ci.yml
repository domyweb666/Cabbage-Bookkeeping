name: CI

on:
  # 分支的推送由 pull_request 觸發，避免同一個 commit 跑兩次。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS（FinanceCore 測試、建置、畫面測試）
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 選 Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP"

      - name: Xcode 版本
        run: xcodebuild -version && swift --version

      - name: FinanceCore 單元測試
        run: swift test --package-path ios/Packages/FinanceCore

      # 規則還沒在這裡跑過，先當參考不擋。看過一輪沒問題就拿掉 continue-on-error。
      - name: SwiftLint（參考，不擋）
        continue-on-error: true
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          cd ios
          swiftlint version
          # 故意寫一個壞檔，規則沒擋到就報錯。
          mkdir -p AIFinance/Features/LintProbe
          {
            echo 'import SwiftUI'
            echo 'let bad = Text("x").padding(.top, 8).font(.system(size: 17))'
          } > AIFinance/Features/LintProbe/Bad.swift
          if swiftlint lint --strict --config .swiftlint.yml AIFinance/Features/LintProbe; then
            echo "::warning::壞檔沒有被擋下來"
          fi
          rm -rf AIFinance/Features/LintProbe
          swiftlint lint --strict --config .swiftlint.yml

      - name: 產生 Xcode 專案
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: 選一台模擬器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          runtimes = sorted((r for r in data if 'iOS' in r), reverse=True)
          for r in runtimes:
              phones = [d for d in data[r] if d['name'].startswith('iPhone') and 'SE' not in d['name']]
              if phones:
                  pick = next((d for d in phones if 'Pro' not in d['name'] and 'Plus' not in d['name']), phones[0])
                  print(pick['udid']); break
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
          # 先把模擬器開好，第一個測試才不會卡在冷開機。
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # 用本機臨時簽章（不用憑證、不碰 secret），entitlements 才會包進去，小工具才讀得到 App Group（準則 2-30）。
      - name: 建置並跑畫面測試
        run: |
          set -o pipefail
          cd ios
          xcodebuild test             -project AIFinance.xcodeproj -scheme AIFinance             -destination "id=${{ steps.sim.outputs.udid }}"             -resultBundlePath build/ui.xcresult             -derivedDataPath build/DerivedData             CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO             2>&1 | tee build.log | grep -E "error:|warning: unre|Test Case|Test Suite|\*\* |Testing failed|failed|passed" | grep -v "^$" | tail -150

      - name: 小工具有包進 App
        if: always()
        run: |
          APP=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/AIFinance.app
          test -d "$APP/PlugIns/BaicaiWidget.appex"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APP/PlugIns/BaicaiWidget.appex/Info.plist"
          # 模擬器版的 entitlements 放在執行檔裡，兩邊都要有同一個群組。
          for bin in "$APP/AIFinance" "$APP/PlugIns/BaicaiWidget.appex/BaicaiWidget"; do
            if ! LC_ALL=C grep -aq "group.org.domyweb.baicai" "$bin" "$bin".debug.dylib 2>/dev/null; then
              echo "::warning::$bin 裡找不到 App Group"
            fi
          done

      - name: 匯出截圖
        if: always()
        run: |
          cd ios
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/screenshots || true
          ls build/screenshots | head -50

      - name: 上傳截圖與紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: |
            ios/build/screenshots
            ios/build.log
          retention-days: 14
